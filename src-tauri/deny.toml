# Config do cargo-deny (usado no workflow Supreme Review).
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Falha em vulnerabilidades conhecidas (RustSec).
yanked = "warn"

[licenses]
# Licenças permitidas. Ajuste conforme necessário.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "GPL-3.0",
]
confidence-threshold = 0.8

[bans]
# Avisa (não falha) em dependências duplicadas.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
