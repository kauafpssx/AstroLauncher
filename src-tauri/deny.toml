# cargo-deny config (used in the Supreme Review workflow).
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fails on known vulnerabilities (RustSec).
yanked = "warn"

[licenses]
# Allowed licenses. Adjust as needed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "GPL-3.0",
]
confidence-threshold = 0.8

[bans]
# Warns (does not fail) on duplicated dependencies.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
