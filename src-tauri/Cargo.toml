[package]
name = "astrolauncher"
version = "0.2.0"
description = "A modern Minecraft launcher"
authors = []
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-clipboard-manager = "2"
thiserror = "2.0.19"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["full"] }
mc-launcher-core = "0.1.2"
mc_chat = "0.3.0"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
reqwest = { version = "0.13.3", features = ["json", "stream"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
zip = "2"
sha1 = "0.11.0"
sha2 = "0.10.9"
md-5 = "0.11.0"
hex = "0.4.3"
dirs = "6.0.0"
tempfile = "3.27.0"
walkdir = "2.5.0"
fs_extra = "1.3.0"
path-clean = "1.0.1"
sysinfo = "0.36.1"
cpal = "0.18.1"
discord-rich-presence = "1.1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
chrono = "0.4.45"
rusqlite = { version = "0.40.1", features = ["bundled"] }
toml = "1.0.7"
jsonwebtoken = "11.0.0"
once_cell = "1.21.4"
parking_lot = "0.12.5"
crossbeam = "0.8.4"
itertools = "0.15.0"
regex = "1.13.1"
semver = "1.0.28"
async-trait = "0.1.91"
futures = "0.3.33"
base64 = "0.22.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
criterion = "0.5.1"
mockall = "0.15.0"
