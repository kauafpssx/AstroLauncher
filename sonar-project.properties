# SonarQube Cloud (ex-SonarCloud).
# ⚠️ Passos:
#   1. Login em https://sonarcloud.io com GitHub, importar o repo.
#   2. Confirmar/ajustar os valores abaixo (organization + projectKey).
#   3. Adicionar secret SONAR_TOKEN no repo (Settings > Secrets > Actions).
#   4. Desligar "Automatic Analysis" no SonarCloud (usamos CI-based).
sonar.organization=kauafpssx
sonar.projectKey=kauafpssx_AstroLauncher
sonar.projectName=AstroLauncher

sonar.sources=src,src-tauri/src
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/*.lock,src-tauri/gen/**

# Coverage (LCOV do Rust, gerado no job de coverage).
sonar.rust.lcov.reportPaths=lcov.info
