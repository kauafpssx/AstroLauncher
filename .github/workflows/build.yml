name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version and compute tag
        id: version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        run: |
          tag="v${{ steps.version.outputs.version }}"
          version="${{ steps.version.outputs.version }}"
          changelog_url="https://github.com/${{ github.repository }}/commits/$tag"
          version_notes_path=".github/releases/$tag.md"
          fallback_notes_path=".github/releases/_template.md"

          if [ -f "$version_notes_path" ]; then
            content=$(cat "$version_notes_path")
          elif [ -f "$fallback_notes_path" ]; then
            content=$(cat "$fallback_notes_path")
          else
            content=$(printf '# AstroLauncher %s\n\n## Resumo\n\n- Atualizacao publicada com binarios gerados automaticamente pelo CI.\n\n## Changelog\n\n- **Changelog completo**: %s\n' "$tag" "$changelog_url")
          fi

          content=${content//\{\{version\}\}/$version}
          content=${content//\{\{tag\}\}/$tag}
          content=${content//\{\{changelog_url\}\}/$changelog_url}

          {
            echo "notes<<EOF_NOTES"
            echo "$content"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles msi'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev \
            xdg-utils \
            file

      - name: Install WebView2
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer
          Start-Process $installer -ArgumentList "/silent /install" -Wait

      - name: Ensure clang-cl is available
        # build.rs requires clang-cl on Windows (C99 fork of cubiomes).
        # LLVM is pre-installed on windows-latest but may not be in PATH.
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Get-Command clang-cl -ErrorAction SilentlyContinue) {
            "✅ clang-cl in PATH: $(Get-Command clang-cl | Select-Object -ExpandProperty Source)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            $llvmBin = "C:\Program Files\LLVM\bin"
            "$llvmBin" >> $env:GITHUB_PATH
            "⚠️ clang-cl not in PATH — added $llvmBin to GITHUB_PATH for subsequent steps" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Verify clang-cl works
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            "❌ clang-cl not found. Install LLVM: winget install -e --id LLVM.LLVM" >> $env:GITHUB_STEP_SUMMARY
            throw "clang-cl not available"
          }
          "✅ clang-cl: $(Get-Command clang-cl | Select-Object -ExpandProperty Source)" >> $env:GITHUB_STEP_SUMMARY

      - name: Install frontend deps
        run: npm ci

      - name: Decode and validate updater signing key
        shell: bash
        env:
          TAURI_PRIVATE_KEY_FILE: ${{ secrets.TAURI_PRIVATE_KEY_FILE }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = process.env.TAURI_PRIVATE_KEY_FILE || "";
            if (!raw.trim()) {
              console.error("TAURI_PRIVATE_KEY_FILE secret is empty.");
              process.exit(1);
            }
            const normalized = raw.replace(/\s+/g, "");
            let decoded;
            try {
              decoded = Buffer.from(normalized, "base64").toString("utf8");
            } catch (e) {
              console.error("TAURI_PRIVATE_KEY_FILE is not valid base64.");
              process.exit(1);
            }
            if (!decoded.startsWith("untrusted comment: rsign encrypted secret key")) {
              console.error("Decoded updater key has unexpected header.");
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${normalized}\n`);
          '

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: AstroLauncher ${{ needs.prepare.outputs.tag }}
          releaseBody: ${{ needs.prepare.outputs.release_notes }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}
