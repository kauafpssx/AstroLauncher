# Test CI — runs on every commit/PR.
# Keeps only the project's test jobs (frontend + Rust + binary build).
# PR review is handled by CodeRabbit (see .coderabbit.yaml).

name: Testes

on:
  # push only on main and tags (avoids running twice on the repo's own PRs)
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancels old runs for the same ref when a new commit arrives.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # ⚛️ FRONTEND — React / TypeScript
  # ────────────────────────────────────────────────────────────────
  frontend:
    name: ⚛️ Frontend (lint / type / build / dead-code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (format:check)
        run: npm run format:check

      - name: TypeScript (tsc --noEmit)
        run: npx tsc -b --noEmit || npx tsc --noEmit

      - name: Build frontend (vite)
        run: npm run build

      - name: Dead code / unused deps (knip)
        run: npm run knip

  # ────────────────────────────────────────────────────────────────
  # 🦀 RUST — fmt / clippy / check / test / doc
  # ────────────────────────────────────────────────────────────────
  rust:
    name: 🦀 Rust (fmt / clippy / check / test / doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # System deps needed to compile Tauri on Linux (webkit, etc.)
      - name: System deps (tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libasound2-dev libdbus-1-dev

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      # -D warnings makes clippy catch dead_code, unused imports/vars, etc.
      - name: cargo clippy (-D warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all

      - name: cargo doc --no-deps
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --no-deps

  # ────────────────────────────────────────────────────────────────
  # 🚀 BUILD TAURI (Windows/macOS/Linux) — ensures each installer compiles
  # ────────────────────────────────────────────────────────────────
  tauri-build:
    name: 🚀 Tauri build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: msi
            target: ''
          - platform: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
            target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev \
            xdg-utils \
            file

      - name: Ensure clang-cl is available
        # build.rs requires clang-cl on Windows (C99 fork of cubiomes).
        # LLVM is pre-installed on windows-latest but may not be in PATH.
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Get-Command clang-cl -ErrorAction SilentlyContinue) {
            "✅ clang-cl in PATH: $(Get-Command clang-cl | Select-Object -ExpandProperty Source)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            $llvmBin = "C:\Program Files\LLVM\bin"
            "$llvmBin" >> $env:GITHUB_PATH
            "⚠️ clang-cl not in PATH — added $llvmBin to GITHUB_PATH for subsequent steps" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Verify clang-cl works
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            "❌ clang-cl not found. Install LLVM: winget install -e --id LLVM.LLVM" >> $env:GITHUB_STEP_SUMMARY
            throw "clang-cl not available"
          }
          "✅ clang-cl: $(Get-Command clang-cl | Select-Object -ExpandProperty Source)" >> $env:GITHUB_STEP_SUMMARY

      - name: Install deps
        run: npm ci

      - name: Build Tauri (no signing)
        # tauri.ci.conf.json disables createUpdaterArtifacts → no signing key required.
        shell: bash
        run: |
          target_arg=""
          if [ -n "${{ matrix.target }}" ]; then
            target_arg="--target ${{ matrix.target }}"
          fi
          npm run tauri build -- --bundles ${{ matrix.bundles }} $target_arg --config src-tauri/tauri.ci.conf.json

      - name: Verify binary exists
        shell: bash
        run: |
          found=$(find src-tauri/target -type f \
            \( -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            2>/dev/null | head -1)
          if [ -z "$found" ]; then
            echo "❌ Nenhum instalador gerado" >&2
            exit 1
          fi
          size=$(du -h "$found" | cut -f1)
          echo "✅ Binário: $found ($size)" >> "$GITHUB_STEP_SUMMARY"
