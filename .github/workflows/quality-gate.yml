# Test CI — runs on every commit/PR.
# Keeps only the project's test jobs (frontend + Rust + binary build).
# PR review is handled by CodeRabbit (see .coderabbit.yaml).

name: Testes

on:
  # push only on main and tags (avoids running twice on the repo's own PRs)
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancels old runs for the same ref when a new commit arrives.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # ⚛️ FRONTEND — React / TypeScript
  # ────────────────────────────────────────────────────────────────
  frontend:
    name: ⚛️ Frontend (lint / type / build / dead-code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (format:check)
        run: npm run format:check

      - name: TypeScript (tsc --noEmit)
        run: npx tsc -b --noEmit || npx tsc --noEmit

      - name: Build frontend (vite)
        run: npm run build

      - name: Dead code / unused deps (knip)
        run: npm run knip

  # ────────────────────────────────────────────────────────────────
  # 🦀 RUST — fmt / clippy / check / test / doc
  # ────────────────────────────────────────────────────────────────
  rust:
    name: 🦀 Rust (fmt / clippy / check / test / doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # System deps needed to compile Tauri on Linux (webkit, etc.)
      - name: System deps (tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libasound2-dev libdbus-1-dev

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      # -D warnings makes clippy catch dead_code, unused imports/vars, etc.
      - name: cargo clippy (-D warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all

      - name: cargo doc --no-deps
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --no-deps

  # ────────────────────────────────────────────────────────────────
  # 🚀 BUILD TAURI (Windows) — ensures the binary compiles
  # ────────────────────────────────────────────────────────────────
  tauri-build:
    name: 🚀 Tauri build (Windows binary)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      - name: Build Tauri (no signing)
        # tauri.ci.conf.json disables createUpdaterArtifacts → no signing key required.
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Verify binary exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -EA SilentlyContinue | Select-Object -First 1
          if ($exe) {
            "✅ Binário: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            throw "Nenhum binário gerado"
          }
